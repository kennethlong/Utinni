# Source: github.com/microsoft/setup-msbuild (README v2), docs.github.com/en/actions/how-tos/monitor-workflows/add-a-status-badge
# Verified action versions as of 2026-05-16: actions/checkout@v4, actions/cache@v4,
# actions/upload-artifact@v4, microsoft/setup-msbuild@v2.
name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:    # allow manual runs (useful while bringing the self-hosted runner online)
  # No pull_request trigger by design. CI runs on a SELF-HOSTED runner because this repo's
  # required toolset (v145 / VS 2026) is not on any GitHub-hosted image. Running untrusted PR
  # code from forks of a PUBLIC repo on a self-hosted runner is a remote-code-execution risk
  # (see GitHub's self-hosted-runner hardening guidance). `master` is only pushed by the
  # maintainer, so only trusted code reaches the runner. If external-contributor PR CI is
  # wanted later, add a SEPARATE hosted lane (windows-2022, /p:PlatformToolset=v143).

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build (Release|x86) + Test (net472)
    runs-on: [self-hosted, windows, x64, utinni-v145]   # this machine: VS 2026 (v145) + VS 2019 (v142/14.29)
    timeout-minutes: 40            # generous — self-hosted cold runs still do NuGet restore + vcpkg + CppSharp post-build

    # This self-hosted runner has Windows PowerShell 5.1 only (no pwsh / PowerShell 7, which
    # GitHub-hosted images pre-install). Default every `run:` step to powershell so the
    # no-shell msbuild/dotnet steps below are covered too. Scripts here use only 5.1-safe syntax.
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1           # no history needed for build

      # Phase 6 D-12 / 06-05 Task 1: style gate. Runs BEFORE the expensive vcpkg/build
      # steps so a formatting regression fails fast. clang-format ships with the VS LLVM
      # component (not on PATH on this self-hosted runner), so resolve it via vswhere like
      # the v145 / VS2019 verify steps below. EOL-agnostic: .clang-format leaves LineEnding
      # unpinned (DeriveLF), so this dry-run passes whether checkout produced CRLF or LF.
      - name: clang-format check (style gate)
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -prerelease -products * -property installationPath
          $clangFormat = Join-Path $vsRoot "VC\Tools\Llvm\bin\clang-format.exe"
          if (-not (Test-Path $clangFormat)) {
            throw "clang-format not found at $clangFormat. Install the VS 'C++ Clang tools for Windows' component."
          }
          Write-Host "Using $clangFormat"
          & $clangFormat --version
          # Same include/exclude set as the local bulk reformat (external/, generated, build output excluded).
          $includeRoots = @("UtinniCore","UtINI","Launcher","UtinniCore-Symbols","Utinni.LoaderLockHarness","Utinni.CrtMatchPlugin","Utinni.LegacyPlugin","UtinniCore.Tests","sdk")
          $excludePattern = '\\(external|bin|obj|Release|Debug|RelWithDbgInfo|x86|x64|\.vs|vcpkg_installed|packages|Generated|TestResults)\\'
          $files = foreach ($r in $includeRoots) {
            if (Test-Path $r) { Get-ChildItem -Path $r -Recurse -Include *.cpp,*.h -File -ErrorAction SilentlyContinue }
          }
          $files = $files | Where-Object { $_.FullName -notmatch $excludePattern } | Sort-Object FullName -Unique
          Write-Host "Checking $($files.Count) C++ files against .clang-format ..."
          # --dry-run --Werror exits non-zero if any file is not already formatted.
          & $clangFormat --style=file --dry-run --Werror -- $files.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "clang-format check failed: files above are not formatted per .clang-format. Run clang-format -i locally and recommit."
          }
          Write-Host "clang-format check passed ($($files.Count) files conform)."

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Phase 6 D-05 + 06-02 Task 1: vcpkg manifest mode is the source of truth
      # for catch2 + spdlog + imgui[docking-experimental,dx9-binding,win32-binding] + imguizmo.
      # nvapi / DetourXS / CppSharp stay vendored under the broken-port fallback (see 06-02-VCPKG-RESEARCH.md).
      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: powershell
        run: |
          # Use the microsoft/setup-vcpkg-style bootstrap: clone, run bootstrap-vcpkg.bat, expose VCPKG_ROOT.
          # The repo's vcpkg-configuration.json default-registry.baseline pins the registry commit, so checkout
          # of microsoft/vcpkg here is just the tool host; the baseline drives port versions.
          $vcpkgDir = "$env:RUNNER_TEMP\vcpkg"
          if (-not (Test-Path "$vcpkgDir\.git")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg "$vcpkgDir"
          }
          & "$vcpkgDir\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed (exit $LASTEXITCODE)" }
          "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vcpkgDir" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install vcpkg dependencies (manifest mode, x86-windows)
        shell: powershell
        run: |
          # T-06-02-04 mitigation: actions/cache@v4 above keyed on vcpkg.json hash makes warm-cache runs fast.
          # T-06-02-01 mitigation: vcpkg-configuration.json default-registry.baseline pin produces reproducible installs.
          vcpkg install --triplet x86-windows --x-manifest-root="${{ github.workspace }}" --x-install-root="${{ github.workspace }}\vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed (exit $LASTEXITCODE)" }

      # Phase 6 D-09 + 06-02 Task 3: PlatformToolset is v145 (VS 2026 / Dev18) across every .vcxproj.
      # SELF-HOSTED: this runner has VS 2026 (MSVC 14.51 + 14.52) installed, so this is
      # VERIFY-ONLY. (v145 is currently an Insiders/preview product with no GA bootstrapper
      # channel, so on-the-fly install on a hosted runner is not viable — that's exactly why
      # CI runs here.)
      - name: Verify v145 build tools
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $hasV145 = $false
          if (Test-Path $vswhere) {
            # v145 PlatformToolset corresponds to MSVC 14.5x (this machine: 14.51 + 14.52).
            $msvcDirs = & $vswhere -products * -find "VC\Tools\MSVC\14.5*\bin" 2>$null
            if ($msvcDirs) { $hasV145 = $true }
          }
          if (-not $hasV145) {
            throw "v145 (MSVC 14.5x / VS 2026) toolset not found on this self-hosted runner. It is required to build; install VS 2026 with the VC.145 workload."
          }
          Write-Host "v145 build tools present."

      # Phase 6 D-09 (Path 1): the CppSharp PostBuildEvent on UtinniCore runs UtinniCoreDotNetGen.exe,
      # which uses vendored CppSharp 0.10.5 (clang 11). On a v145 toolset build the v145 STL fails to
      # parse under clang 11 (header-resident clang-version gate in yvals_core.h). UtinniCoreDotNetGen's
      # Program.cs::ConfigureCppSharpParserStl() pins the parser to the VS 2019 14.29 STL via vswhere /
      # default-path probe / UTINNI_VS2019_ROOT env var. That requires the v142 toolset (MSVC 14.29) to
      # actually be installed on the runner. See
      # .planning/research/cppsharp-msvc-14.5-upgrade.md.
      # SELF-HOSTED: VS 2019 BuildTools (MSVC 14.29.30133) is installed on this machine, so
      # VERIFY-ONLY. ConfigureCppSharpParserStl() resolves it via vswhere / default-path /
      # UTINNI_VS2019_ROOT.
      - name: Verify VS 2019 BuildTools (MSVC 14.29) for CppSharp parser STL pin
        shell: powershell
        run: |
          $has1429 = $false
          $candidates = @(
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2019\BuildTools\VC\Tools\MSVC",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2019\Community\VC\Tools\MSVC",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2019\Professional\VC\Tools\MSVC",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2019\Enterprise\VC\Tools\MSVC"
          )
          foreach ($base in $candidates) {
            if (Test-Path $base) {
              $msvc = Get-ChildItem $base -Directory -Filter "14.29.*" -ErrorAction SilentlyContinue
              if ($msvc) { $has1429 = $true; break }
            }
          }
          if (-not $has1429) {
            throw "MSVC 14.29 (VS 2019 v142) not found. Required for the CppSharp parser STL pin (Program.cs::ConfigureCppSharpParserStl)."
          }
          Write-Host "MSVC 14.29 (VS 2019 v142) present for CppSharp parser pin."

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        # Post-Phase 6 D-09 sweep, PlatformToolset=v145 is declared in every .vcxproj so MSBuild auto-selects
        # v145. The "Verify v145 build tools" step above guarantees v145 is available on the runner.

      - name: Build solution (Release|x86)
        run: msbuild Utinni.sln /m /restore /p:Configuration=Release /p:Platform=x86 /p:RestorePackagesConfig=true
        # Fires CON-T-01 PostBuildEvent on UtinniCore (xcopy data/ + UtinniCoreDotNetGen.exe). STAB-04 preservation: invoke the chain; do not refactor.

      - name: Build tools solution (Debug|Win32) — AUTH-01 hard gate
        shell: powershell
        run: msbuild tools\Utinni.Tools.sln /m /p:Configuration=Debug /p:Platform=Win32
        # Phase 12 (AUTH-01 / D-07): standalone lift-and-shift build of the revived SOE build CLIs
        # (TreeFileBuilder + TemplateCompiler + TemplateDefinitionCompiler). Kept SEPARATE from the
        # Utinni.sln steps above (D-07: tools/ is its own solution). x86/Win32 only (CON-P-02). A
        # non-zero MSBuild exit fails the job, so the revive hard gate is enforced continuously from
        # day one. Byte-exact smoke steps (D-09) are added per tool once maintainer-provided
        # reference pairs land (12-03 Task 1/2); tools parked behind a gate-finding build here but
        # have no smoke step (the finding lives in tools/DEPENDENCY-MANIFEST.md).

      - name: Run tests (net472 / x86)
        run: dotnet test UtinniCoreDotNet.Tests/UtinniCoreDotNet.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=test-results.trx"
        # Project-targeted (not `dotnet test Utinni.sln`) per RESEARCH §Pitfall 2 — dotnet/sdk#9007 + microsoft/vstest#1129 confirm the solution form fails on mixed C++/C# solutions.
        # --no-build because msbuild above already produced bin/Release/net472/UtinniCoreDotNet.Tests.dll.

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: UtinniCoreDotNet.Tests/TestResults/*.trx
          if-no-files-found: warn

      - name: Run CLI golden tests (net472 / x86)
        run: dotnet test Utinni.Cli.Tests/Utinni.Cli.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=cli-test-results.trx"
        # Phase 4 D-11: second test lane gates `master` on the CLI golden suite.
        # Project-targeted form per RESEARCH §Pitfall 2; --no-build because msbuild above already produced bin/Release/net472/Utinni.Cli.Tests.dll.

      - name: Upload CLI test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-test-results
          path: |
            Utinni.Cli.Tests/TestResults/cli-test-results.trx
            Utinni.Cli.Tests/bin/Release/net472/TestResults/**/*.json
            Utinni.Cli.Tests/bin/Release/net472/TestResults/**/*.txt
          if-no-files-found: warn

      - name: Build native tests (Debug|x86) — triple-config verification per 05-REVIEWS.md item C3
        shell: powershell
        run: msbuild Utinni.sln /m /p:Configuration=Debug /p:Platform=x86 /t:UtinniCore_Tests
        # Targeted build (only the test exe project), not full solution rebuild.
        # Satisfies ROADMAP Phase 5 success criterion #1 literal reading: "builds in CI under all three native configs."

      - name: Build native tests (RelWithDbgInfo|x86) — triple-config verification per 05-REVIEWS.md item C3
        shell: powershell
        run: msbuild Utinni.sln /m /p:Configuration=RelWithDbgInfo /p:Platform=x86 /t:UtinniCore_Tests
        # Targeted build (only the test exe project). RelWithDbgInfo is the CON-T-02 / D-07 config most prone to
        # silent collapse-to-Release at the sln-mapping layer; building it in CI catches regressions early.

      - name: Create native test results directory (per 05-REVIEWS.md item U4)
        working-directory: ${{ github.workspace }}
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path UtinniCore.Tests\TestResults | Out-Null
        # Catch2's std::ofstream-based junit reporter does NOT create parent dirs. Codex review (HIGH) caught this.

      - name: Run native unit tests (UtinniCore.Tests.exe, Release|x86)
        shell: powershell
        run: |
          # Phase 5 D-04: third CI lane gates `master` on the native test suite.
          # Direct exe invocation (not `dotnet test`) because the runner is Catch2 self-runner.
          # Stacked --reporter flags: console sets the exit code on failure (RESEARCH §Pitfall 5);
          # junit writes XML for triage. Output dir was created in the preceding step.
          # Only Release runs the exe; Debug + RelWithDbgInfo are build-only verification per 05-REVIEWS.md item C3.
          & bin\Release\UtinniCore.Tests.exe `
            --reporter console `
            --reporter "junit::out=UtinniCore.Tests\TestResults\junit-results.xml"

      - name: Upload native test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          path: UtinniCore.Tests/TestResults/junit-results.xml
          if-no-files-found: warn
