# Source: github.com/microsoft/setup-msbuild (README v2), docs.github.com/en/actions/how-tos/monitor-workflows/add-a-status-badge
# Verified action versions as of 2026-05-16: actions/checkout@v4, actions/cache@v4,
# actions/upload-artifact@v4, microsoft/setup-msbuild@v2.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build (Release|x86) + Test (net472)
    runs-on: windows-2022          # deterministic pin; windows-latest now points at windows-2025 (migrated 2025-09-02); revisit in Phase 6
    timeout-minutes: 25            # generous — first cold-cache runs include NuGet restore + CppSharp post-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1           # no history needed for build

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # UtinniCore.vcxproj hard-codes the default DXSDK (June 2010) include/lib paths.
      # windows-2022 runners don't ship d3dx9.h (removed from Win10 SDK), so install the
      # legacy SDK once and cache the install directory to keep cold-cache CI tolerable.
      - name: Cache DirectX SDK (June 2010)
        id: cache-dxsdk
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)
          key: dxsdk-jun2010-v1

      - name: Install DirectX SDK (June 2010)
        if: steps.cache-dxsdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # S1023 workaround: the June 2010 installer fails when a newer VC++ 2010 SP1
          # runtime (x86 or x64) is already installed. windows-2022 ships both; uninstall
          # them before invoking DXSETUP. See https://support.microsoft.com/help/2728613.
          $vc2010 = @(
            '{1F1C2DFC-2D24-3E06-BCB8-725134ADF989}',  # x86 SP1
            '{1D8E6291-B0D5-35EC-8441-6616F567A0F7}'   # x64 SP1
          )
          foreach ($code in $vc2010) {
            Start-Process msiexec.exe -ArgumentList '/x', $code, '/quiet', '/norestart' -Wait -NoNewWindow
          }
          # Official direct download from Microsoft, ~600 MB.
          $url = 'https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'DXSDK_Jun10.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          # /U triggers the InstallShield unattended path; default install location is
          # C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\ which matches
          # the absolute paths UtinniCore.vcxproj already references.
          Start-Process $exe -ArgumentList '/U' -Wait -NoNewWindow
          if (-not (Test-Path 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\Include\d3dx9.h')) {
            throw 'DXSDK install completed but d3dx9.h was not found at the expected default path.'
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        # windows-2022 has VS 2022 with v142 toolset preinstalled
        # (Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64); MSBuild auto-selects v142
        # because PlatformToolset=v142 is declared in every .vcxproj. RESEARCH §Pitfall 1.

      - name: Build solution (Release|x86)
        run: msbuild Utinni.sln /m /restore /p:Configuration=Release /p:Platform=x86 /p:RestorePackagesConfig=true
        # Fires CON-T-01 PostBuildEvent on UtinniCore (xcopy data/ + UtinniCoreDotNetGen.exe). STAB-04 preservation: invoke the chain; do not refactor.

      - name: Run tests (net472 / x86)
        run: dotnet test UtinniCoreDotNet.Tests/UtinniCoreDotNet.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=test-results.trx"
        # Project-targeted (not `dotnet test Utinni.sln`) per RESEARCH §Pitfall 2 — dotnet/sdk#9007 + microsoft/vstest#1129 confirm the solution form fails on mixed C++/C# solutions.
        # --no-build because msbuild above already produced bin/Release/net472/UtinniCoreDotNet.Tests.dll.

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: UtinniCoreDotNet.Tests/TestResults/*.trx
          if-no-files-found: warn

      - name: Run CLI golden tests (net472 / x86)
        run: dotnet test Utinni.Cli.Tests/Utinni.Cli.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=cli-test-results.trx"
        # Phase 4 D-11: second test lane gates `master` on the CLI golden suite.
        # Project-targeted form per RESEARCH §Pitfall 2; --no-build because msbuild above already produced bin/Release/net472/Utinni.Cli.Tests.dll.

      - name: Upload CLI test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-test-results
          path: |
            Utinni.Cli.Tests/TestResults/cli-test-results.trx
            Utinni.Cli.Tests/bin/Release/net472/TestResults/**/*.json
            Utinni.Cli.Tests/bin/Release/net472/TestResults/**/*.txt
          if-no-files-found: warn
